<svg viewBox="0 0 1440 900" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Main gradient -->
    <linearGradient id="mainGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B38B8"></stop>
      <stop offset="45%" stop-color="#5A57E6"></stop>
      <stop offset="75%" stop-color="#6F6CFF"></stop>
      <stop offset="100%" stop-color="#7C7AFF"></stop>
    </linearGradient>

    <!-- Text readability -->
    <linearGradient id="textFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3B38B8" stop-opacity="0.55"></stop>
      <stop offset="40%" stop-color="#3B38B8" stop-opacity="0.35"></stop>
      <stop offset="65%" stop-color="#3B38B8" stop-opacity="0.12"></stop>
      <stop offset="80%" stop-color="#3B38B8" stop-opacity="0"></stop>
    </linearGradient>
  </defs>

  <!-- Base -->
  <rect width="1440" height="900" fill="url(#mainGradient)"></rect>

  <!-- Bottom-left FULL half circle -->
  <path d="
      M 0 960
      A 320 320 0 0 1 640 960
      L 640 960
      Z
    " fill="#8E93FF" opacity="0.35"></path>

  <!-- Middle-right FULL half circle -->
  <path d="
      M 1520 230
      A 260 260 0 0 0 1260 490
      A 260 260 0 0 0 1520 750
      Z
    " fill="#A5AAFF" opacity="0.38"></path>

  <!-- LARGE circles -->
  <!-- Top-left -->
  <circle cx="260" cy="100" r="140" fill="#FFFFFF" opacity="0.18"></circle>

  <!-- Top-right-ish -->
  <circle cx="980" cy="180" r="150" fill="#FFFFFF" opacity="0.16"></circle>

  <!-- Bottom-right (moved DOWN) -->
  <circle cx="980" cy="760" r="170" fill="#C7CBFF" opacity="0.28"></circle>

  <!-- Text safety overlay -->
  <rect width="1440" height="900" fill="url(#textFade)"></rect>
</svg>
