<svg viewBox="0 0 1440 900" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Base background gradient -->
    <linearGradient id="bg-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E1B4B"></stop>
      <stop offset="55%" stop-color="#4F46E5"></stop>
      <stop offset="100%" stop-color="#6D5BFF"></stop>
    </linearGradient>

    <!-- Soft glow blur -->
    <filter id="blur-lg" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="120"></feGaussianBlur>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1440" height="900" fill="url(#bg-gradient)"></rect>

  <!-- Left glow cluster (subtle, layered) -->
  <circle cx="-180" cy="260" r="420" fill="#A5B4FC" opacity="0.18" filter="url(#blur-lg)"></circle>

  <circle cx="120" cy="520" r="300" fill="#818CF8" opacity="0.16" filter="url(#blur-lg)"></circle>

  <circle cx="360" cy="760" r="240" fill="#6366F1" opacity="0.12" filter="url(#blur-lg)"></circle>

</svg>
