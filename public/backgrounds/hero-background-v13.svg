<svg viewBox="0 0 1440 900" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Primary left-to-right SaaS gradient -->
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4F46E5"></stop>
      <stop offset="45%" stop-color="#6D5BFF"></stop>
      <stop offset="100%" stop-color="#E0E7FF"></stop>
    </linearGradient>

    <!-- Depth shadow (very subtle, SaaS-style) -->
    <linearGradient id="depth" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.18"></stop>
      <stop offset="35%" stop-color="#000000" stop-opacity="0.06"></stop>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"></stop>
    </linearGradient>

    <!-- Soft highlight to avoid flatness -->
    <linearGradient id="highlight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18"></stop>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.06"></stop>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"></stop>
    </linearGradient>
  </defs>

  <!-- Base gradient -->
  <rect width="1440" height="900" fill="url(#base)"></rect>

  <!-- Left depth -->
  <rect width="1440" height="900" fill="url(#depth)"></rect>

  <!-- Subtle highlight -->
  <rect width="1440" height="900" fill="url(#highlight)"></rect>
</svg>
