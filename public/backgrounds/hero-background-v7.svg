<svg viewBox="0 0 1440 900" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Main gradient -->
    <linearGradient id="mainGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2B287A"></stop>
      <stop offset="45%" stop-color="#3F3CCF"></stop>
      <stop offset="75%" stop-color="#5B56F0"></stop>
      <stop offset="100%" stop-color="#6D5BFF"></stop>
    </linearGradient>

    <!-- Text-side contrast -->
    <linearGradient id="textFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2B287A" stop-opacity="0.95"></stop>
      <stop offset="40%" stop-color="#2B287A" stop-opacity="0.85"></stop>
      <stop offset="65%" stop-color="#2B287A" stop-opacity="0.35"></stop>
      <stop offset="80%" stop-color="#2B287A" stop-opacity="0"></stop>
    </linearGradient>

    <!-- Focus glow -->
    <radialGradient id="focusGlow" cx="78%" cy="48%" r="32%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.12"></stop>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"></stop>
    </radialGradient>

    <!-- Vignette -->
    <radialGradient id="vignette" cx="70%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"></stop>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.22"></stop>
    </radialGradient>
  </defs>

  <!-- Base -->
  <rect width="1440" height="900" fill="url(#mainGradient)"></rect>

  <!-- Focus glow behind UI card -->
  <rect width="1440" height="900" fill="url(#focusGlow)"></rect>

  <!-- Depth -->
  <rect width="1440" height="900" fill="url(#vignette)"></rect>

  <!-- Text safety -->
  <rect width="1440" height="900" fill="url(#textFade)"></rect>
</svg>
