<svg viewBox="0 0 1440 900" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Base gradient -->
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2B2F7F"></stop>
      <stop offset="55%" stop-color="#4F46E5"></stop>
      <stop offset="100%" stop-color="#6D5BFF"></stop>
    </linearGradient>
  </defs>

  <!-- Base -->
  <rect width="1440" height="900" fill="url(#base)"></rect>

  <!-- LEFT FRAME (large, partially off-canvas) -->
  <circle cx="-120" cy="450" r="420" fill="#A5B4FC" opacity="0.24"></circle>

  <!-- LEFT INNER (medium, overlaps large) -->
  <circle cx="160" cy="620" r="280" fill="#C7B7FE" opacity="0.22"></circle>

  <!-- TOP RIGHT FRAME (small accent) -->
  <circle cx="1220" cy="-40" r="200" fill="#8B5CF6" opacity="0.26"></circle>

  <!-- BOTTOM RIGHT FRAME (medium anchor) -->
  <circle cx="1180" cy="920" r="320" fill="#DDD6FE" opacity="0.28"></circle>
</svg>
