<svg viewBox="0 0 1440 900" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">

  <defs>
    <!-- stronger left darkening overlay -->
    <linearGradient id="left-darken" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.32"></stop>
      <stop offset="65%" stop-color="#000000" stop-opacity="0"></stop>
    </linearGradient>
  </defs>

  <!-- SOLID BACKGROUND -->
  <rect width="1440" height="900" fill="#4F46E5"></rect>

  <!-- LEFT DARKEN OVERLAY -->
  <rect width="1440" height="900" fill="url(#left-darken)"></rect>

  <!-- HORIZONTAL FLIP -->
  <g transform="translate(1440 0) scale(-1 1)">

    <!-- LEFT INNER (medium) -->
    <circle cx="160" cy="620" r="280" fill="#C7B7FE" opacity="0.22"></circle>

    <!-- TOP RIGHT FRAME (small accent) -->
    <circle cx="1220" cy="-40" r="200" fill="#8B5CF6" opacity="0.26"></circle>

    <!-- BOTTOM RIGHT FRAME -->
    <circle cx="1080" cy="980" r="320" fill="#DDD6FE" opacity="0.28"></circle>

  </g>
</svg>
