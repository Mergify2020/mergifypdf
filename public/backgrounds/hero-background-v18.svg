<svg viewBox="0 0 1440 900" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <!-- Balanced SaaS purple -->
      <stop offset="0%" stop-color="#4338CA"></stop>
      <!-- Light purple bottom (soft, not white) -->
      <stop offset="100%" stop-color="#EEF2FF"></stop>
    </linearGradient>
  </defs>

  <rect width="1440" height="900" fill="url(#bg)"></rect>
</svg>
